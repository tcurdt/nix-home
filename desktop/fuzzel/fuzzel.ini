# App launcher (CMD+Space). Managed by nix-home.

[main]
font=Noto Sans:size=12
terminal=kitty
launch-prefix=uwsm app --
width=40
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=89b4faff
input=cdd6f4ff
match=89b4faff
selection=45475aff
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff

[border]
width=2
radius=10
