# Lock screen. Managed by nix-home.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(1e1e2e)
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = Noto Sans
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    rounding = 10
    outline_thickness = 2
    outer_color = rgb(89b4fa)
    inner_color = rgb(313244)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}
