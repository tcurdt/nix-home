# Idle and sleep handling (hypridle still uses the hyprlang format).
# Managed by nix-home.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # turn the panel back on right away after waking up
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # wait for the lock screen before suspending
    inhibit_sleep = 3
}

# dim screen and switch off keyboard light after 4 minutes
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10% && brightnessctl -sd smc::kbd_backlight set 0
    on-resume = brightnessctl -r && brightnessctl -rd smc::kbd_backlight
}

# lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
